<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm Chess Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #f8f8f8;
        }

        #app, #app * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script>
        Elm.Chess.Main.init({
            node: document.getElementById('app'),
            flags: {
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight
            }
        });
    </script>
</body>
</html>
