<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm Checkers Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
        }

        #app, #app * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script>
        var appNode = document.getElementById("app");

        Elm.Checkers.Main.init({
            node: appNode
        });

        ["selectstart", "dragstart", "dblclick", "contextmenu"].forEach(function (eventName) {
            appNode.addEventListener(eventName, function (event) {
                event.preventDefault();
            });
        });

        document.addEventListener("selectionchange", function () {
            var selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) {
                return;
            }

            var anchorInside = selection.anchorNode && appNode.contains(selection.anchorNode);
            var focusInside = selection.focusNode && appNode.contains(selection.focusNode);

            if (anchorInside || focusInside) {
                selection.removeAllRanges();
            }
        });
    </script>
</body>
</html>
