<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm Checkers Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
        }

        #app, #app * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script>
        Elm.Checkers.Main.init({
            node: document.getElementById("app")
        });
    </script>
</body>
</html>
