<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elm Labyrinth</title>
    <style>* {
  box-sizing: border-box;
}

html,
body,
#app {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f2f6fb, #e8eef4);
  color: #1a2533;
}

.app {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 10px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(5, minmax(160px, 1fr));
  gap: 8px 12px;
  background: #ffffffc7;
  border: 1px solid #c8d4e2;
  border-radius: 10px;
  padding: 10px;
}

.control {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.actions,
.metrics {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.maze-shell {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #ffffffea;
  border: 1px solid #c8d4e2;
  border-radius: 10px;
  padding: 8px;
}

.maze-shell svg {
  max-width: 100%;
  max-height: 100%;
  display: block;
}

button {
  border: 1px solid #8ca6bf;
  border-radius: 8px;
  background: #edf4fb;
  color: #1a2533;
  padding: 6px 10px;
  cursor: pointer;
}

input[type="range"] {
  width: 100%;
}

@media (max-width: 980px) {
  .controls {
    grid-template-columns: repeat(2, minmax(140px, 1fr));
  }
}

@media print {
  body,
  #app,
  .app {
    background: white;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
  }

  .controls {
    display: none;
  }

  .maze-shell {
    border: 0;
    border-radius: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .maze-shell svg {
    max-width: 100%;
    max-height: 100%;
  }
}
</style>
